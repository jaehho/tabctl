[project]
name = "tabctl"
version = "0.4.0"
description = "List, focus, open and group Firefox tabs from the command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tabctl = "tabctl.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4",
  "SIM", "RUF", "PERF", "PIE", "RET", "RSE",
  "ARG", "PTH", "FLY", "PL", "TRY", "T20", "T10",
]
# A CLI states its errors where it raises them.
ignore = ["COM812", "ISC001", "TRY003"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
# The command line prints: that is its interface.
"src/tabctl/cli.py" = ["T201"]
"scripts/*" = ["T201", "PLR2004"]
